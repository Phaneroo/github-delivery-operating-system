# Run once: Actions → Setup Labels → Run workflow
# Uses built-in GITHUB_TOKEN — no personal token or gh CLI needed.
# Label definitions live in .github/scripts/labels.tsv — the single source of
# truth also read by scripts/install.sh and src/install.js. labels.js is the
# JS-side parser over that file.

name: Setup Labels

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-labels:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create labels
        uses: actions/github-script@v9
        with:
          script: |
            const scriptsDir = `${process.env.GITHUB_WORKSPACE}/.github/scripts`;
            let labels;
            try {
              labels = require(`${scriptsDir}/labels.js`).readLabels(scriptsDir);
            } catch (e) {
              // core.setFailed (not just console.log + return): otherwise this
              // step — and the whole workflow run — shows a green check even
              // though zero labels were created, since nothing else here ever
              // throws or reports a non-zero exit.
              core.setFailed(
                `Could not read label definitions from ${scriptsDir} (labels.js/labels.tsv): ${e.message}. ` +
                  'No labels were created. Re-run "npx github-delivery-os@latest install --with-templates --update ." to repair this install, then run this workflow again.'
              );
              return;
            }
            let created = 0;
            for (const [name, color, description] of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                  ...(description ? { description } : {}),
                });
                console.log(`Created: ${name}`);
                created++;
              } catch (e) {
                if (e.message?.includes('already exists')) {
                  console.log(`Exists: ${name}`);
                } else {
                  console.log(`Failed: ${name} - ${e.message}`);
                }
              }
            }
            console.log(`\nCreated ${created} label(s).`);
