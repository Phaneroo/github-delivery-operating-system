name: Auto QA Request

# Safety-net tracking, not a gate: whenever work reaches `main`, whether or
# not it went through a PR, it gets a "please test this" reminder. Nothing is
# blocked — see docs/architecture.md.
#
# Two styles, set by DELIVERY_OS_AUTO_QA_MODE:
#   rolling (default)  one open "QA REQUEST - Changes awaiting QA" issue per
#                      repo; each direct push / merged PR adds a checklist line.
#                      QA_APPROVER approves or declines it (qa-rollup-approval.yml).
#   per-change         the 1.8.0 behavior: a QA Request (+ Task if nothing is
#                      linked) per PR as it opens and per direct push.
#   off                nothing is filed.
#
# Tunable per repo without editing this file (so `install --update` keeps it):
#   DELIVERY_OS_AUTO_QA   1.8.0 setting, still honored: all → per-change,
#                         pr-only → direct pushes add nothing, off → off
#   DELIVERY_OS_AUTO_TASK false → per-change direct pushes file no Task
#   DELIVERY_OS_AUTO_QA_QUIET_PATHS globs whose changes alone file nothing
#                         (defaults to docs/settings — see auto-qa-request.js)
# and per commit with `[skip qa-request]` in a direct push's message.
#
# A PR closed without merging never reaches `main`, so the second job below
# closes whatever was auto-filed for it.
on:
  pull_request:
    # synchronize: a PR that started docs-only can gain code later, so it's
    # re-checked on every push (the idempotency check stops duplicates).
    # reopened: restores what was closed when the PR was closed unmerged.
    types: [opened, ready_for_review, reopened, synchronize, closed]
  push:
    branches: [main]

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  file-qa-request:
    # Event shape only (a merged PR's `closed` event is how rolling mode
    # records PRs); the script resolves the mode settings itself.
    if: >-
      vars.DELIVERY_OS_AUTO_QA_MODE != 'off' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
        (github.event.action != 'closed' || github.event.pull_request.merged == true)) ||
       github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
      contents: read # needed for actions/checkout, so this workflow's script can be required from the repo

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: File QA request (and a backing Task, if nothing already tracks this work)
        uses: actions/github-script@v9
        env:
          DELIVERY_OS_AUTO_QA_MODE: ${{ vars.DELIVERY_OS_AUTO_QA_MODE }}
          DELIVERY_OS_AUTO_QA: ${{ vars.DELIVERY_OS_AUTO_QA }}
          DELIVERY_OS_AUTO_TASK: ${{ vars.DELIVERY_OS_AUTO_TASK }}
          DELIVERY_OS_AUTO_QA_QUIET_PATHS: ${{ vars.DELIVERY_OS_AUTO_QA_QUIET_PATHS }}
        with:
          script: |
            // Pure parsing/body-building logic lives in a real, unit-tested
            // module (see .github/scripts/auto-qa-request.js and
            // test/auto-qa-request.test.js) rather than inline here, so it
            // isn't only verified by hand whenever it changes.
            const {
              extractLinkedIssueNumbers,
              extractCommitIssueReferences,
              allCommitsSkipped,
              pushLinkText,
              pushTitle,
              findFilingsForPr,
              resolveQaSettings,
              ROLLING_TITLE,
              ROLLING_LABELS,
              buildChangeLine,
              buildRollingQaBody,
              hasChange,
              appendChange,
              parseChanges,
              autoTaskEnabledForDirectPush,
              resolveQuietPaths,
              isQuietChange,
              touchedPathsFromApiFiles,
              seedChangeSummary,
              extractAcceptanceCriteria,
              parseMergedPrNumber,
              buildAutoTaskBody,
              buildQaRequestBody,
              qaRequestAlreadyExists,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/auto-qa-request.js`);

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const settings = resolveQaSettings(process.env.DELIVERY_OS_AUTO_QA_MODE, process.env.DELIVERY_OS_AUTO_QA);
            const isPr = context.eventName === 'pull_request';
            const prMerged = isPr && context.payload.action === 'closed';
            if (settings.style === 'off') {
              console.log('Auto QA is off for this repo — nothing to file.');
              return;
            }
            if (!isPr && settings.prOnly) {
              console.log('DELIVERY_OS_AUTO_QA=pr-only — direct pushes add nothing.');
              return;
            }
            if (settings.style === 'rolling' && isPr && !prMerged) {
              console.log('Rolling QA mode records a PR when it merges — nothing to do yet.');
              return;
            }
            if (settings.style === 'per-change' && prMerged) {
              console.log('Per-change mode filed this PR when it opened — nothing to do on merge.');
              return;
            }

            let prNumber, prTitle, prUrl, prBody, branch, author, filesChanged, touchedPaths, commitMessages, viaDirectPush, originMarker;

            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              prNumber = pr.number;
              prTitle = pr.title;
              prUrl = pr.html_url;
              prBody = pr.body || '';
              branch = pr.head.ref;
              author = pr.user.login;
              viaDirectPush = false;
              originMarker = `PR #${prNumber}`;

              // Reopening a PR that was closed unmerged: bring back the Task /
              // QA Request closed then, instead of filing duplicates.
              if (context.payload.action === 'reopened') {
                const closedFilings = (await github.paginate(github.rest.issues.listForRepo, {
                  owner, repo, state: 'closed', labels: 'delivery-ops-filed', per_page: 100
                })).filter((i) => i.state_reason === 'not_planned');
                const toReopen = findFilingsForPr(closedFilings, prNumber);
                for (const n of toReopen) {
                  await github.rest.issues.update({ owner, repo, issue_number: n, state: 'open' });
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: n,
                    body: `PR #${prNumber} was reopened — reopening this automatically.`
                  });
                  console.log(`Reopened #${n} for reopened PR #${prNumber}.`);
                }
                if (toReopen.length) return;
              }

              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: prNumber, per_page: 100
              });
              filesChanged = files.map((f) => f.filename);
              touchedPaths = touchedPathsFromApiFiles(files);

              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner, repo, pull_number: prNumber, per_page: 100
              });
              commitMessages = commits.map((c) => c.commit.message);
            } else {
              const headCommit = context.payload.head_commit;
              const message = headCommit ? headCommit.message : '';

              // A push to main from merging (or squash-merging) a PR is
              // already covered by the pull_request event above — skip it,
              // otherwise every ordinary merge would also look like an
              // untracked direct push and file a duplicate Task + QA Request.
              // (Rebase-merge commits carry no reliable marker and can't be
              // detected this way; see parseMergedPrNumber's doc comment.)
              if (parseMergedPrNumber(message) !== null) {
                console.log('Push is a PR merge already handled by the pull_request event — skipping.');
                return;
              }

              // Rolling mode records merged PRs from their `closed` event, so
              // a rebase-merge push (no merge marker in its message) would
              // otherwise be recorded twice. Ask GitHub which PR it came from.
              if (settings.style === 'rolling') {
                try {
                  const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: context.sha });
                  const mergedPr = prs.find((p) => p.merged_at);
                  if (mergedPr) {
                    console.log(`Push comes from merged PR #${mergedPr.number}, recorded by its own event — skipping.`);
                    return;
                  }
                } catch (err) {
                  console.log(`Couldn't check for an associated PR (${err.message}) — treating as a direct push.`);
                }
              }

              // The push payload carries no file lists (and at most 20
              // commits), so ask the API: the whole push range, or just the
              // commit for a branch's first push.
              let apiFiles = null;
              let apiMessages = null;
              try {
                const before = context.payload.before;
                if (before && !/^0+$/.test(before)) {
                  const { data } = await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `${before}...${context.sha}` });
                  apiFiles = data.files || [];
                  apiMessages = (data.commits || []).map((c) => c.commit.message);
                } else {
                  const { data } = await github.rest.repos.getCommit({ owner, repo, ref: context.sha });
                  apiFiles = data.files || [];
                  apiMessages = [data.commit.message];
                }
              } catch (err) {
                console.log(`Couldn't list the push's files/commits (${err.message}) — using the event payload.`);
              }
              commitMessages = apiMessages || (context.payload.commits || []).map((c) => c.message);

              // Per-commit opt-out: skip only when every commit is marked.
              if (allCommitsSkipped(commitMessages)) {
                console.log('Every commit in this push has [skip qa-request] — skipping.');
                return;
              }

              prNumber = null;
              prTitle = pushTitle(message, commitMessages) || `Direct push to main (${context.sha.slice(0, 7)})`;
              prUrl = '';
              prBody = pushLinkText(message, commitMessages); // a direct push's issue links live in its commit messages
              branch = 'main';
              author = headCommit && headCommit.author ? (headCommit.author.username || headCommit.author.name) : null;
              touchedPaths = touchedPathsFromApiFiles(apiFiles);
              filesChanged = apiFiles ? apiFiles.map((f) => f.filename) : [];
              viaDirectPush = true;
              originMarker = `Direct push #${context.sha}`;
            }

            const quietPaths = resolveQuietPaths(process.env.DELIVERY_OS_AUTO_QA_QUIET_PATHS);
            if (isQuietChange(touchedPaths, quietPaths)) {
              console.log(`Only docs/settings changed (${touchedPaths.join(', ')}) — nothing to QA, skipping.`);
              return;
            }

            // First real issue this work links to. PR bodies link via closing
            // keywords; commit messages also count `Refs #N` / bare `#N`,
            // which can point at a PR rather than an issue.
            async function findLinkedIssue() {
              const candidates = viaDirectPush
                ? extractCommitIssueReferences(prBody)
                : extractLinkedIssueNumbers(prBody);
              for (const n of candidates.slice(0, 5)) {
                try {
                  const linked = await github.rest.issues.get({ owner, repo, issue_number: n });
                  if (linked.data.pull_request) {
                    console.log(`#${n} is a pull request, not an issue — ignoring.`);
                    continue;
                  }
                  return { number: n, acceptanceCriteria: extractAcceptanceCriteria(linked.data.body || '') };
                } catch (err) {
                  console.log(`Linked issue #${n} not found (${err.message}) — ignoring.`);
                }
              }
              return { number: null, acceptanceCriteria: null };
            }

            if (settings.style === 'rolling') {
              const linked = await findLinkedIssue();
              const block = buildChangeLine({
                title: prTitle,
                ref: prNumber ? `#${prNumber}` : context.sha.slice(0, 7),
                author,
                linkedIssue: linked.number,
                originMarker,
                summary: seedChangeSummary({ title: prTitle, commitMessages }),
              });

              const listOpenRolling = async () =>
                (await github.paginate(github.rest.issues.listForRepo, {
                  owner, repo, state: 'open', labels: ROLLING_LABELS.join(','), per_page: 100
                })).filter((i) => !i.pull_request).sort((a, b) => a.number - b.number);
              const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

              // Two runs can race (pushes seconds apart). Appending is a
              // read-modify-write of the body, so re-read after writing and
              // retry if another run's write replaced ours.
              for (let attempt = 1; attempt <= 5; attempt++) {
                let open = await listOpenRolling();

                if (!open.length) {
                  const created = await github.rest.issues.create({
                    owner, repo, title: ROLLING_TITLE, body: buildRollingQaBody(block), labels: ROLLING_LABELS
                  });
                  console.log(`Opened rolling QA issue #${created.data.number} with ${originMarker}.`);
                  // If another run opened one at the same moment, fold the
                  // newer ones into the oldest so only one stays open.
                  await sleep(2000);
                  open = await listOpenRolling();
                  if (open.length > 1) {
                    const [keep, ...extras] = open;
                    let keepBody = keep.body || '';
                    for (const extra of extras) {
                      for (const change of parseChanges(extra.body)) {
                        if (!hasChange(keepBody, change.originMarker)) keepBody = appendChange(keepBody, change.block);
                      }
                    }
                    await github.rest.issues.update({ owner, repo, issue_number: keep.number, body: keepBody });
                    for (const extra of extras) {
                      await github.rest.issues.createComment({
                        owner, repo, issue_number: extra.number,
                        body: `Opened at the same moment as #${keep.number} — its changes were moved there. Closing this duplicate.`
                      });
                      await github.rest.issues.update({ owner, repo, issue_number: extra.number, state: 'closed', state_reason: 'not_planned' });
                      console.log(`Folded duplicate rolling issue #${extra.number} into #${keep.number}.`);
                    }
                  }
                  return;
                }

                const rolling = open[0];
                if (hasChange(rolling.body, originMarker)) {
                  console.log(`${originMarker} is already on rolling QA issue #${rolling.number} — skipping.`);
                  return;
                }
                await github.rest.issues.update({ owner, repo, issue_number: rolling.number, body: appendChange(rolling.body, block) });
                await sleep(1000 + Math.floor(Math.random() * 2000));
                const { data: fresh } = await github.rest.issues.get({ owner, repo, issue_number: rolling.number });
                if (hasChange(fresh.body, originMarker)) {
                  console.log(`Added ${originMarker} to rolling QA issue #${rolling.number}.`);
                  return;
                }
                console.log(`Another update replaced ours on #${rolling.number} — retrying (attempt ${attempt}).`);
              }
              core.setFailed(`Couldn't add ${originMarker} to the rolling QA issue after 5 attempts.`);
              return;
            }

            // ---- per-change mode (the 1.8.0 behavior) ----

            // Idempotency: don't file a second QA Request for the same PR/push.
            const openQaRequests = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'qa-request', per_page: 100
            });
            if (qaRequestAlreadyExists(openQaRequests, originMarker)) {
              console.log(`QA Request already filed for ${originMarker} — skipping.`);
              return;
            }

            // Find (or file) a Task issue this work is actually tracked under.
            let { number: relatedIssueNumber, acceptanceCriteria } = await findLinkedIssue();

            if (!relatedIssueNumber && viaDirectPush && !autoTaskEnabledForDirectPush(process.env.DELIVERY_OS_AUTO_TASK)) {
              console.log('No linked issue, and DELIVERY_OS_AUTO_TASK=false — filing the QA Request without a Task.');
            } else if (!relatedIssueNumber) {
              const taskBody = buildAutoTaskBody({ number: prNumber, title: prTitle, url: prUrl, author, viaDirectPush });
              const created = await github.rest.issues.create({
                owner, repo,
                title: `TASK - ${prTitle}`.slice(0, 250),
                body: taskBody,
                labels: ['task', 'delivery-ops-filed']
              });
              relatedIssueNumber = created.data.number;
              console.log(`No linked issue found — filed Task #${relatedIssueNumber}.`);
            }

            const qaBody = buildQaRequestBody({
              relatedIssueNumber, prNumber, prTitle, prUrl, branch, filesChanged, acceptanceCriteria, originMarker,
              // A plain-English changelog draft for a dev to confirm, so QA knows what to test.
              changeSummary: seedChangeSummary({ title: prTitle, commitMessages }),
            });

            const qaIssue = await github.rest.issues.create({
              owner, repo,
              title: `QA REQUEST - ${prTitle}`.slice(0, 250),
              body: qaBody,
              labels: ['qa-request', 'delivery-ops-filed']
            });

            console.log(`Filed QA Request #${qaIssue.data.number} for ${originMarker} (related: ${relatedIssueNumber ? `#${relatedIssueNumber}` : 'none'}).`);

  close-abandoned-pr-filings:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read # needed for actions/checkout, so this workflow's script can be required from the repo

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Close the Task / QA Request auto-filed for this unmerged PR
        uses: actions/github-script@v9
        with:
          script: |
            const { findFilingsForPr } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/auto-qa-request.js`);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;

            // Only issues this workflow filed — never anything a person filed.
            const openFilings = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'delivery-ops-filed', per_page: 100
            });

            for (const issueNumber of findFilingsForPr(openFilings, prNumber)) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `PR #${prNumber} was closed without merging, so this work never reached \`main\` — closing automatically. Reopen if it continues elsewhere.`
              });
              await github.rest.issues.update({ owner, repo, issue_number: issueNumber, state: 'closed', state_reason: 'not_planned' });
              console.log(`Closed #${issueNumber} (auto-filed for unmerged PR #${prNumber}).`);
            }
