name: Notify Release Approver

# Also posts the release roll-up: one comment listing the plain-English
# "What Changed" notes from every QA Request this release likely covers.
# Informational only; re-run it with
#   gh workflow run notify-release-approver.yml -f release_issue=<N>
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      release_issue:
        description: "Production Release issue number to refresh the roll-up for"
        required: true

permissions:
  issues: write

jobs:
  notify:
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name || fromJSON('[]'), 'production')
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Post Approval Comment
        uses: actions/github-script@v9
        env:
          RELEASE_APPROVER: ${{ vars.RELEASE_APPROVER || 'release-approver' }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME || '' }}
        with:
          script: |
            const issueTitle = context.payload.issue.title;
            const issueBody = context.payload.issue.body || "";
            const approver = process.env.RELEASE_APPROVER;
            const projectName = process.env.PROJECT_NAME;

            let sprintRef = "Not specified";
            const sprintMatch = issueBody.match(/#\d+/);
            if (sprintMatch) sprintRef = sprintMatch[0];

            let qaRecommendation = "Not specified";
            if (issueBody.includes("Approve for Production")) qaRecommendation = "Approve for Production";
            else if (issueBody.includes("Reject Release")) qaRecommendation = "Reject Release";
            else if (issueBody.includes("Conditional Approval")) qaRecommendation = "Conditional Approval";

            const projectLine = projectName ? "**Project:** " + projectName + "\n\n" : "";
            const commentBody =
              "🚨 @" + approver + " Production Release requires approval.\n\n" +
              projectLine +
              "**Issue:** " + issueTitle + "\n\n" +
              "**Linked Sprint:** " + sprintRef + "\n\n" +
              "**QA Recommendation:** " + qaRecommendation + "\n\n" +
              "Please review the sprint delivery and QA sign-off details above before approving deployment.\n\n" +
              "🔒 Deployment must not proceed without your approval.";

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });

  release-rollup:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name || fromJSON('[]'), 'production')
    # Independent of `notify` (no `needs`), so a manual refresh works and a
    # roll-up failure can never hold up or break the approver ping.
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
      contents: read # needed for actions/checkout, so this workflow's script can be required from the repo

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Post release roll-up
        uses: actions/github-script@v9
        env:
          RELEASE_ISSUE: ${{ github.event.inputs.release_issue || github.event.issue.number }}
        with:
          script: |
            const {
              ROLLUP_MARKER,
              findPreviousAuthorizedRelease,
              selectQaRequestsInWindow,
              selectRollingIssues,
              parseOriginPrNumber,
              buildRollupComment,
            } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-rollup.js`);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releaseNumber = parseInt(process.env.RELEASE_ISSUE, 10);

            const { data: release } = await github.rest.issues.get({ owner, repo, issue_number: releaseNumber });
            const releaseLabels = (release.labels || []).map((l) => (typeof l === 'string' ? l : l.name));
            if (!releaseLabels.includes('production')) {
              core.setFailed(`#${releaseNumber} isn't a Production Release issue (no 'production' label).`);
              return;
            }

            const productionIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', labels: 'production', per_page: 100
            });
            const previousRelease = findPreviousAuthorizedRelease(productionIssues, release);

            // Every open request (an old one still open hasn't shipped yet),
            // plus closed ones touched since the previous release. `since`
            // filters on updated_at, which is always >= created_at, so it's a
            // safe pre-filter for the created_at window below.
            const openQa = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'qa-request', per_page: 100
            });
            const closedQa = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'closed', labels: 'qa-request', per_page: 100,
              ...(previousRelease ? { since: previousRelease.created_at } : {})
            });
            const qaIssues = [...openQa, ...closedQa];
            const inWindow = selectQaRequestsInWindow(qaIssues, previousRelease && previousRelease.created_at, release.created_at);

            // Leave out work whose PR hasn't merged — it isn't on main yet.
            // One lookup per distinct PR, run concurrently.
            const prNumbers = [...new Set(inWindow.map((qa) => parseOriginPrNumber(qa.body)).filter(Boolean))];
            const mergedByPr = new Map(await Promise.all(prNumbers.map(async (n) => {
              try {
                const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: n });
                return [n, Boolean(pr.merged)];
              } catch (err) {
                console.log(`Couldn't check PR #${n} (${err.message}) — including its QA Request.`);
                return [n, true];
              }
            })));

            const qaRequests = [];
            const unmerged = [];
            for (const qa of inWindow) {
              const prNumber = parseOriginPrNumber(qa.body);
              if (prNumber && !mergedByPr.get(prNumber)) {
                unmerged.push({ number: qa.number, prNumber });
                continue;
              }
              qaRequests.push(qa);
            }

            // The rolling QA issue(s): the open one plus any approved since
            // the previous release (closed ones come from closedQa above).
            const rolling = selectRollingIssues(qaIssues, previousRelease && previousRelease.created_at, release.created_at);

            const body = buildRollupComment({ qaRequests, unmerged, previousRelease, rolling });

            // One roll-up per release: update it in place on a refresh.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: releaseNumber, per_page: 100
            });
            const existing = comments.find((c) => (c.body || '').startsWith(ROLLUP_MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: releaseNumber, body });
            }
            console.log(`Roll-up for #${releaseNumber}: ${qaRequests.length} QA Request(s), ${unmerged.length} unmerged skipped.`);
