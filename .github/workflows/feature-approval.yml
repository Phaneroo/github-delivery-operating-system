name: Feature Approval

# Approves or declines a Feature Request (label `feature`) before work starts.
# Only FEATURE_APPROVER counts: a repo variable (a login, or a comma-separated
# list) that is deliberately separate from RELEASE_APPROVER and has no
# fallback, so feature sign-off and release sign-off can be different people.
# While it is unset the workflow says so on the issue and approves nothing.
#   notify   a new `feature` issue pings the feature approver(s)
#   approve  a comment starting with `approved` / `go ahead` / ✅ 👍 ✔️, or
#            consisting only of `ok` / `approve` (so "ok, but what about X?"
#            in a discussion is not an approval)
#            → `approved` added, `needs-approval`/`declined` removed
#   decline  a comment starting with declined / rejected / not approved or
#            ❌ 👎 🚫      → `declined` added, `needs-approval`/`approved` removed
# Per approver, the latest verdict counts, and a decline stands until that
# same person approves (another approver's approval is refused), as in the
# release gate. Only open issues are acted on. After approval the same issue
# tracks the work.
#   re-review  after a decline, the issue's author comments `ready for review`
#            → `declined` removed, `needs-approval` back, approver(s) pinged.
#            Edits alone never re-queue it.
# The decline words are the release gate's
# (.github/scripts/authorize-deployment-verdict.js).
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  notify:
    if: >-
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name || fromJSON('[]'), 'feature') &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Ping the feature approver
        uses: actions/github-script@v9
        env:
          FEATURE_APPROVER: ${{ vars.FEATURE_APPROVER }}
        with:
          script: |
            const approverNames = (process.env.FEATURE_APPROVER || '').split(',').map((s) => s.trim().replace(/^@/, '')).filter(Boolean);
            const body = approverNames.length
              ? `${approverNames.map((a) => '@' + a).join(' ')} a Feature Request is waiting for your approval. Comment \`approved\` to start the work or \`declined\` to send it back.`
              : '⚠️ The repo variable `FEATURE_APPROVER` is not set, so nobody can approve this Feature Request yet. Set it under Settings → Secrets and variables → Actions → Variables (a GitHub login, or a comma-separated list). It is separate from `RELEASE_APPROVER`.';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number, body,
            });

  verdict:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name || fromJSON('[]'), 'feature') &&
      !github.event.issue.pull_request &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read # needed for actions/checkout, so this workflow's script can be required from the repo
    concurrency:
      group: feature-approval-${{ github.event.issue.number }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply the approver's verdict
        uses: actions/github-script@v9
        env:
          FEATURE_APPROVER: ${{ vars.FEATURE_APPROVER }}
        with:
          script: |
            const { matchVerdict, phraseRegex, wholeCommentRegex, RELEASE_DECLINE_PHRASES } =
              require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/authorize-deployment-verdict.js`);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.payload.issue.number;
            const approverNames = (process.env.FEATURE_APPROVER || '').split(',').map((s) => s.trim().replace(/^@/, '')).filter(Boolean);
            const isApprover = (login) => approverNames.some((a) => a.toLowerCase() === (login || '').toLowerCase());

            // "ok" / "approve" start too many ordinary sentences to trust as a
            // prefix on a discussion thread, so they count only as the whole comment.
            const vocab = {
              approve: phraseRegex(['approved', 'go ahead']),
              approveWhole: wholeCommentRegex(['ok', 'approve']),
              decline: phraseRegex(RELEASE_DECLINE_PHRASES),
              approveEmoji: ['✅', '👍', '✔️', '✔'],
              declineEmoji: ['❌', '👎', '🚫'],
            };

            const actor = context.payload.comment.user.login;

            // After a decline, the issue's author asks for another look. Only that
            // comment re-queues it: edits and ordinary replies leave it alone.
            if (/^ready for review\b/i.test((context.payload.comment.body || '').trim())) {
              const author = context.payload.issue.user && context.payload.issue.user.login;
              if (!(author && author.toLowerCase() === actor.toLowerCase()) && !isApprover(actor)) return;
              const { data: now } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
              const nowLabels = now.labels.map((l) => (typeof l === 'string' ? l : l.name));
              if (!nowLabels.includes('declined') || nowLabels.includes('approved')) return;
              await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: ['needs-approval'] });
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: 'declined' });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `🔁 @${actor} asked for another review. ${approverNames.length ? approverNames.map((a) => '@' + a).join(' ') + ' please take another look.' : 'The repo variable `FEATURE_APPROVER` is not set, so nobody can approve it yet.'}`,
              });
              return;
            }

            if (!isApprover(actor)) return;
            const verdict = matchVerdict(context.payload.comment.body, vocab);
            if (!verdict) return;

            // Each approver's latest verdict on this issue (this comment included).
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issueNumber, per_page: 100 });
            const latest = {};
            for (const c of comments) {
              if (!isApprover(c.user && c.user.login)) continue;
              const v = matchVerdict(c.body, vocab);
              if (v) latest[c.user.login.toLowerCase()] = { v, login: c.user.login };
            }
            latest[actor.toLowerCase()] = { v: verdict, login: actor };

            // Live labels, not the event snapshot: comments seconds apart queue
            // under the concurrency group and must see each other's changes.
            const { data: live } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            const labels = live.labels.map((l) => (typeof l === 'string' ? l : l.name));

            if (verdict === 'approved') {
              const blockedBy = Object.keys(latest).filter((a) => a !== actor.toLowerCase() && latest[a].v === 'declined').map((a) => latest[a].login);
              if (blockedBy.length) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issueNumber,
                  body: `@${actor} this feature was declined by ${blockedBy.map((a) => '@' + a).join(', ')}. Only the approver who declined it can lift the decline, by approving.`,
                });
                return;
              }
            }

            const add = verdict === 'approved' ? 'approved' : 'declined';
            const drop = (verdict === 'approved' ? ['needs-approval', 'declined'] : ['needs-approval', 'approved']).filter((n) => labels.includes(n));

            // Add the verdict label first: if a later call fails, the issue still
            // carries a label that says where it stands.
            const alreadyThere = labels.includes(add);
            if (!alreadyThere) await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: [add] });
            for (const name of drop) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }
            if (alreadyThere) return; // already in this state: no second announcement

            await github.rest.issues.createComment({
              owner, repo, issue_number: issueNumber,
              body: verdict === 'approved'
                ? `✅ **Feature approved** by @${actor}. This issue now tracks the work: link PRs to it and close it when the feature ships.`
                : `🔴 **Feature declined** by @${actor}. It needs changes before it can be approved; update the requirements, then the approver can approve again.`,
            });
