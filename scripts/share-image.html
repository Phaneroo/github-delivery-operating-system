<!DOCTYPE html>
<!--
  Source for docs/img/share-image-2.png (the link-preview image, 1200x630).
  Re-render after editing (LinkedIn caches images by URL, so bump the file name, e.g. -3, and update the og:image tags when you change it):
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
      --window-size=1200,630 --screenshot=docs/img/share-image-2.png file://$PWD/scripts/share-image.html
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delivery OS share image</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; }
    body {
      background: #1c1e21;
      color: #f5f6f7;
      font-family: 'DM Sans', system-ui, sans-serif;
      position: relative;
      overflow: hidden;
    }
    .glow {
      position: absolute;
      right: -180px;
      top: -200px;
      width: 760px;
      height: 760px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(146, 200, 61, 0.22), rgba(146, 200, 61, 0) 65%);
    }
    .wrap {
      position: relative;
      height: 100%;
      padding: 60px 64px;
      display: flex;
      align-items: center;
      gap: 48px;
    }
    .logo {
      flex: none;
      width: 360px;
      height: 360px;
    }
    h1 {
      font-size: 100px;
      line-height: 1.02;
      letter-spacing: -0.035em;
      font-weight: 700;
    }
    h1 span { color: #92c83d; }
    .tag {
      margin-top: 24px;
      font-size: 44px;
      line-height: 1.25;
      color: #b4b8bd;
      font-weight: 500;
      max-width: 660px;
    }
    .agents {
      margin-top: 30px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 30px;
      color: #92c83d;
    }
    .bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 10px;
      background: #92c83d;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <img class="logo" src="../docs/logo.png" alt="">
    <div>
      <h1>GitHub<br>Delivery <span>OS</span></h1>
      <p class="tag">Sprints, QA and release sign&#8209;off inside GitHub.</p>
      <p class="agents">Works with any AI coding agent</p>
    </div>
  </div>
  <div class="bar"></div>
</body>
</html>
