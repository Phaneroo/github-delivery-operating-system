# Run once: Actions → Setup Labels → Run workflow
# Uses built-in GITHUB_TOKEN — no personal token or gh CLI needed.
# Label definitions live in .github/scripts/labels.js — the single source of
# truth also read by scripts/install.sh and src/install.js.

name: Setup Labels

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-labels:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create labels
        uses: actions/github-script@v7
        with:
          script: |
            const { LABELS } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/labels.js`);
            let created = 0;
            for (const [name, color, description] of LABELS) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                  ...(description ? { description } : {}),
                });
                console.log(`Created: ${name}`);
                created++;
              } catch (e) {
                if (e.message?.includes('already exists')) {
                  console.log(`Exists: ${name}`);
                } else {
                  console.log(`Failed: ${name} - ${e.message}`);
                }
              }
            }
            console.log(`\nCreated ${created} label(s).`);
